# Cria o pagamento: exige usuário logado (JWT do app).
[functions.mp-criar-pagamento]
verify_jwt = true

# Webhook do Mercado Pago: chamado pelo MP (sem JWT).
[functions.mp-webhook]
verify_jwt = false

# Assinatura Stripe: exige usuário logado.
[functions.stripe-checkout]
verify_jwt = true

# Webhook do Stripe: chamado pelo Stripe (sem JWT; valida a assinatura própria).
[functions.stripe-webhook]
verify_jwt = false

# Régua automática: chamada pelo pg_cron (sem JWT; confere x-regua-secret).
[functions.regua-automatica]
verify_jwt = false
