# Resumo diário por e-mail para os professores (Sala dos professores, etapa 5).
# Todo dia às 7h de Brasília chama a função resumo-diario do Supabase, que manda
# no máximo um e-mail por professor por dia, só quando há dúvida esperando ou
# comentário/menção nas últimas 24 h. Usa a chave PÚBLICA do app (a mesma que
# está no index.html); a chave do Resend fica nos segredos das funções do Supabase.
name: Resumo diário dos professores
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
jobs:
  chamar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chama a função resumo-diario
        run: |
          set -e
          CHAVE=$(grep -oE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' index.html | head -1)
          URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' index.html | head -1)
          test -n "$CHAVE" && test -n "$URL"
          curl -sS --fail-with-body -X POST "$URL/functions/v1/resumo-diario" \
            -H "Authorization: Bearer $CHAVE" -H "apikey: $CHAVE" -H "Content-Type: application/json" -d '{}'
